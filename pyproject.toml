[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-discovery-agent"
version = "0.1.0"
description = "Budgeted experiment-campaign agent: an LLM orchestrates surrogate proposals, feasibility checks, multi-fidelity assays and replication under a hard cost ledger, on synthetic response surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aamir Malik" }]
keywords = ["llm-agents", "bayesian-optimization", "active-learning", "materials-discovery", "autonomous-experimentation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[project.scripts]
budgeted-discovery-agent = "budgeted_discovery_agent.__main__:main"

[project.urls]
Repository = "https://github.com/aamirmalik-dr/budgeted-discovery-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
