# v2 run A. Pre-registered fixes (plans in the repo history and docs/evaluation.md),
# fresh held-out v2 family, same model and caps as v1. Frozen 2026-11-09 before
# the run. The model is pinned here and overrides AGENT_MODEL_NAME.
mode: live
model: openai/gpt-4.1-mini        # via OpenRouter
families: [heldout_v2]
arms: [random_feasible, cost_aware, tuned_acquisition, single_call, agent, agent_default_selector, agent_no_replicate]
runs: 2
episode:
  max_steps: 44
  max_tool_calls: 36
  max_tokens: 80000
  max_wall_seconds: 600
  recent_k: 4
  max_completion_tokens: 400
run_caps:
  max_total_tokens: 6000000
  max_usd: 2.00                   # checked before every episode at the prices below
  usd_per_mtok_input: 0.40        # OpenRouter listed price, 2026-11-09
  usd_per_mtok_output: 1.60
output_dir: reports/live_v2
checkpoint_dir: runs/v2a
